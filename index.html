<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Borderlands 2 Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #app {
    flex: 1;
    position: relative;
    background: #111;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas {
    pointer-events: none;
  }
  .controls {
    height: 120px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 20px;
    border-top: 1px solid #333;
  }
  button {
    background: #222;
    border: 2px solid #ff3b30;
    color: #fff;
    border-radius: 50%;
    width: 70px;
    height: 70px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  button:active { transform: scale(0.95); }
  button.record {
    width: 80px;
    height: 80px;
    background: #ff3b30;
    border-color: #fff;
  }
  button.record.recording {
    background: #ff9500;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .status {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 10;
  }
  .style-label {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #e74c3c;
    color: #fff;
    padding: 6px 12px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 12px;
    z-index: 10;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="style-label">BORDERLANDS 2</div>
  <div class="status" id="status">Ładowanie kamery...</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div class="controls">
  <button id="switchCam">📷</button>
  <button id="recordBtn" class="record">REC</button>
  <button id="snapshot">📸</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const recordBtn = document.getElementById('recordBtn');
const switchBtn = document.getElementById('switchCam');
const snapBtn = document.getElementById('snapshot');

let stream = null;
let facingMode = 'environment';
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'Gotowe \u2022 Styl Borderlands 2';
    resizeCanvas();
    processFrame();
  } catch (err) {
    statusEl.textContent = 'B\u0142\u0105d kamery: ' + err.message;
    console.error(err);
  }
}

function resizeCanvas() {
  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);

function quantize(value, levels = 6) {
  const step = 255 / (levels - 1);
  return Math.round(value / step) * step;
}

function processFrame() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const w = canvas.width;
    const h = canvas.height;

    for (let i = 0; i < data.length; i += 4) {
      data[i]     = quantize(data[i] * 1.15, 5);
      data[i + 1] = quantize(data[i + 1] * 1.1, 5);
      data[i + 2] = quantize(data[i + 2] * 1.2, 5);
    }

    const edges = new Uint8ClampedArray(data.length);
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = (y * w + x) * 4;
        const left = (y * w + (x - 1)) * 4;
        const right = (y * w + (x + 1)) * 4;
        const up = ((y - 1) * w + x) * 4;
        const down = ((y + 1) * w + x) * 4;

        const dx = Math.abs(data[idx] - data[left]) + Math.abs(data[idx] - data[right]);
        const dy = Math.abs(data[idx] - data[up]) + Math.abs(data[idx] - data[down]);
        const edge = Math.min(255, (dx + dy) * 0.8);

        if (edge > 40) {
          edges[idx] = edges[idx + 1] = edges[idx + 2] = 0;
          edges[idx + 3] = 255;
        }
      }
    }

    for (let i = 0; i < data.length; i += 4) {
      if (edges[i + 3] === 255) {
        data[i] = data[i + 1] = data[i + 2] = 0;
      }
    }

    ctx.putImageData(imageData, 0, 0);
  }
  requestAnimationFrame(processFrame);
}

recordBtn.addEventListener('click', () => {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  const canvasStream = canvas.captureStream(30);
  recordedChunks = [];
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';
  mediaRecorder = new MediaRecorder(canvasStream, { mimeType: mime });
  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `borderlands2-camera-${Date.now()}.webm`;
    a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = 'Nagranie zapisane!';
  };
  mediaRecorder.start();
  isRecording = true;
  recordBtn.classList.add('recording');
  recordBtn.textContent = 'STOP';
  statusEl.textContent = 'Nagrywanie...';
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  recordBtn.classList.remove('recording');
  recordBtn.textContent = 'REC';
}

snapBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `borderlands2-snap-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  statusEl.textContent = 'Zrzut zapisany!';
});

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

startCamera();
</script>
</body>
</html>
